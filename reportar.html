<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar un caso - Cali Vigilante</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <h1>Cali Vigilante</h1>
        <p class="tagline">
            Registro ciudadano de presuntos abusos de autoridad
        </p>
        <nav class="main-nav">
            <ul>
                <li>
                    <a href="index.html">Inicio</a>
                </li>
                <li>
                    <a href="reportar.html">Reportar un caso</a>
                </li>
                <li>
                    <a href="casos.html">Ver casos registrados</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="formulario">

            <h2 id="titulo_form">
                Registrar nuevo caso
            </h2>
            <form id="form-reporte">
                <div class="campo">
                    <label for="fecha">
                        Fecha del incidente:
                    </label>
                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required
                    >
                </div>
                <div class="campo">
                    <label for="lugar">
                        Lugar (barrio, comuna, sitio):
                    </label>
                    <input
                        type="text"
                        id="lugar"
                        name="lugar"
                        placeholder="Ej: Loma de la Cruz"
                        required
                        minlength="3"
                        pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ0-9\s]+"
                    >
                </div>
                <div class="campo">
                    <label for="autoridad">
                        Autoridad involucrada:
                    </label>

                    <select
                        id="autoridad"
                        name="autoridad"
                        required
                    >
                        <option value="policia">
                            Policía Nacional
                        </option>
                        <option value="esmad">
                            ESMAD
                        </option>
                        <option value="ejercito">
                            Ejército
                        </option>
                        <option value="otra">
                            Otra
                        </option>
                    </select>
                </div>
                <div class="campo">
                    <label for="descripcion">
                        Descripción del hecho:
                    </label>
                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        required
                        minlength="10"
                    ></textarea>
                </div>
                <button type="submit">
                    Enviar reporte
                </button>
            </form>
        </section>
    </main>
    <footer class="site-footer">
        <p>
            Proyecto académico — Curso de Desarrollo Web.
            Datos de ejemplo, no representan casos reales.
        </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
