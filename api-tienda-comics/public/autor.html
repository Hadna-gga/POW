<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalles del autor</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header class="encabezado">
    <h1>🦸 Tienda de Cómics</h1>
    <p>Detalles del autor</p>
  </header>

  <main class="contenedor">
    <p><a class="volver" href="index.html">← Volver a los cómics</a></p>

    <section class="tarjeta" id="contenido">Cargando...</section>
  </main>

  <script type="module">
    import { obtenerAutor } from "./js/api.js";

    const contenido = document.getElementById("contenido");

    const etiquetas = {
      nacionalidad: "Nacionalidad",
      fechaNacimiento: "Fecha de nacimiento",
      biografia: "Biografía",
      descripcion: "Descripción"
    };

    function formatearFecha(iso) {
      return new Date(iso).toLocaleDateString("es-CO", {
        day: "numeric",
        month: "long",
        year: "numeric",
        timeZone: "UTC"
      });
    }

    async function cargarAutor() {
      try {
        const id = new URLSearchParams(window.location.search).get("id");

        if (!id) {
          contenido.textContent = "No se indicó el ID del autor.";
          contenido.className = "mensaje error";
          return;
        }

        const autor = await obtenerAutor(id);

        contenido.replaceChildren();

        const nombre = document.createElement("h2");
        nombre.textContent = autor.nombre || "Autor sin nombre";
        contenido.append(nombre);

        for (const [campo, valor] of Object.entries(autor)) {
          if (
            ["_id", "__v", "nombre", "createdAt", "updatedAt"].includes(campo) ||
            valor === null ||
            valor === undefined ||
            valor === ""
          ) {
            continue;
          }

          const dato = document.createElement("p");

          const etiqueta = document.createElement("strong");
          etiqueta.textContent = (etiquetas[campo] || campo) + ": ";

          const texto = document.createElement("span");
          texto.textContent =
            campo === "fechaNacimiento" ? formatearFecha(valor) : String(valor);

          dato.append(etiqueta, texto);
          contenido.append(dato);
        }
      } catch (error) {
        contenido.textContent = "No se pudo cargar el autor: " + error.message;
        contenido.className = "mensaje error";
      }
    }

    cargarAutor();
  </script>
</body>
</html>
