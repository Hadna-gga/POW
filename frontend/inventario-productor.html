<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario del productor | Del Campo a Tu Mesa</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/mensajes.js"></script>
    <script src="js/sesion.js"></script>
</head>

<body>
    <a class="skip-link" href="#main">Saltar al contenido principal</a>


    <div class="pagina-productor">
        <aside class="barra-lateral">
            <h2>Productor</h2>
            <nav aria-label="Navegación del productor">
                <a href="perfil-productor.html">
                    <span aria-hidden="true">👤</span><span class="nav-label">Perfil</span>
                </a>
                <a href="productos-productor.html">
                    <span aria-hidden="true">📦</span><span class="nav-label">Productos</span>
                </a>
                <a href="inventario-productor.html">
                    <span aria-hidden="true">🗃️</span><span class="nav-label">Inventario</span>
                </a>
                <a href="productor.html">
                    <span aria-hidden="true">↩️</span><span class="nav-label">Inicio</span>
                </a>
                <a href="index.html">
                    <span aria-hidden="true">🏠</span><span class="nav-label">Página principal</span>
                </a>
                <button type="button" id="cerrar-sesion">
                    <span aria-hidden="true">🚪</span>
                    <span class="nav-label">Cerrar sesión</span>
                </button>
            </nav>
        </aside>

        <main id="main" class="inventario">
            <h1>Inventario</h1>
            <div class="grafica">
                <h2>Estadísticas del mes</h2>
                <div class="espacio-grafica" id="estadisticas-mes" aria-live="polite">
                    Cargando estadísticas...
                </div>
            </div>
            <h2 class="titulo-productos">Productos</h2><br>
            <table class="tabla-inventario">
                <caption>Productos y disponibilidad en inventario</caption>
                <thead>
                    <tr>
                        <th scope="col">Producto</th>
                        <th scope="col">Cantidad</th>
                        <th scope="col">Precio</th>
                        <th scope="col">Estado</th>
                    </tr>
                </thead>
                <tbody id="lista-inventario">
                </tbody>
            </table>
        </main>
    </div>

    <script>
        async function cargarInventario() {
            const tabla = document.getElementById("lista-inventario");
            const token = sessionStorage.getItem("token");
            const usuario = JSON.parse(
                sessionStorage.getItem("usuario") || "null"
            );

            if (!token || !usuario || usuario.rol !== "productor") {
                alert("Debes iniciar sesión como productor");
                window.location.replace("login.html");
                return;
            }

            try {
                const respuesta = await fetch(
                    "/api/productos/mis-productos",
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                if (!respuesta.ok) {
                    throw new Error("No se pudo consultar el inventario");
                }

                const productos = await respuesta.json();
                tabla.innerHTML = "";

                if (productos.length === 0) {
                    const fila = tabla.insertRow();
                    const celda = fila.insertCell();
                    celda.colSpan = 4;
                    celda.textContent = "Todavía no tienes productos registrados.";
                    return;
                }

                productos.forEach(producto => {
                    const fila = tabla.insertRow();

                    fila.insertCell().textContent = producto.nombre;
                    fila.insertCell().textContent = producto.cantidad;
                    fila.insertCell().textContent =
                        "$" + producto.precio.toLocaleString("es-CO");

                    fila.insertCell().textContent =
                        producto.cantidad > 0 ? "Disponible" : "Agotado";
                });

            } catch (error) {
                console.error(error);
                tabla.innerHTML = "";
                const fila = tabla.insertRow();
                const celda = fila.insertCell();
                celda.colSpan = 4;
                celda.textContent = "No se pudo cargar el inventario.";
            }
        }

        function pesos(valor) {
            return "$" + Number(valor || 0).toLocaleString("es-CO");
        }

        // F2. Estadísticas del mes: lo vendido en los productos de este productor
        async function cargarEstadisticas() {
            const contenedor = document.getElementById("estadisticas-mes");

            try {
                const datos = await Sesion.llamarAPI("/api/pedidos/ventas-mes");
                contenedor.textContent = "";

                const cifras = document.createElement("ul");
                cifras.className = "cifras-mes";
                [
                    "Pedidos: " + datos.pedidos,
                    "Unidades vendidas: " + datos.unidades,
                    "Ingresos por tus productos: " + pesos(datos.ingresos)
                ].forEach(function (texto) {
                    const li = document.createElement("li");
                    li.textContent = texto;
                    cifras.appendChild(li);
                });
                contenedor.appendChild(cifras);

                if (datos.productos.length === 0) {
                    const vacio = document.createElement("p");
                    vacio.textContent = "Todavía no hay ventas este mes.";
                    contenedor.appendChild(vacio);
                    return;
                }

                // Barras horizontales: unidades vendidas por producto
                const maximo = Math.max.apply(null, datos.productos.map(function (p) { return p.unidades; }));

                datos.productos.forEach(function (producto) {
                    const fila = document.createElement("div");
                    fila.className = "barra-fila";

                    const nombre = document.createElement("span");
                    nombre.className = "barra-nombre";
                    nombre.textContent = producto.nombre;

                    const pista = document.createElement("div");
                    pista.className = "barra-pista";
                    const barra = document.createElement("div");
                    barra.className = "barra-valor";
                    barra.style.width = Math.max(4, Math.round(producto.unidades / maximo * 100)) + "%";
                    pista.appendChild(barra);

                    const valor = document.createElement("span");
                    valor.className = "barra-numero";
                    valor.textContent = producto.unidades + " u · " + pesos(producto.ingresos);

                    fila.append(nombre, pista, valor);
                    contenedor.appendChild(fila);
                });

            } catch (error) {
                console.error(error);
                contenedor.textContent = "No se pudieron cargar las estadísticas.";
            }
        }

        cargarInventario();
        cargarEstadisticas();
    </script>
    <script>
        document.getElementById("cerrar-sesion").addEventListener("click", function () {
            sessionStorage.removeItem("token");
            sessionStorage.removeItem("usuario");

            window.location.replace("login.html");
        });
    </script>
</body>

</html>
