<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Del Campo a Tu Mesa</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/mensajes.js"></script>
    <script src="js/sesion.js"></script>
</head>

<body>
    <a class="skip-link" href="#main">Saltar al contenido principal</a>
    <header>
        <h1>Del Campo a Tu Mesa</h1>
        <nav aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="registro.html">Registrarme</a>
        </nav>
    </header>

    <main id="main">
        <form class="formulario" id="formulario-login">
            <h2>Iniciar sesión</h2>
            <label for="correo">Correo</label>
            <input type="email" id="correo" autocomplete="username" required placeholder="Ingrese su correo">
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" autocomplete="current-password" required
                placeholder="Ingrese su contraseña">
            <button type="submit" id="boton-login">Iniciar sesión</button>
            <!-- NUEVO: acceso con Google -->
            <p class="separador-google">o</p>
            <a class="boton-google" href="/api/usuarios/google">Continuar con Google</a>
        </form>
    </main>

    <footer>
        <p>Del Campo a Tu Mesa</p>
        <p>Comisión solidaria transparente</p>
    </footer>

    <script>
        const API_LOGIN = "/api/usuarios/login";

        // NUEVO: si Google falló o el usuario canceló, el servidor vuelve con ?error=google
        if (new URLSearchParams(window.location.search).get("error") === "google") {
            alert("No se pudo iniciar sesión con Google. Intenta de nuevo");
        }

        document.getElementById("formulario-login").addEventListener("submit", async function (event) {
            event.preventDefault();

            const boton = document.getElementById("boton-login");
            const correo = document.getElementById("correo").value.trim();
            const contrasena = document.getElementById("contrasena").value;

            boton.disabled = true;

            try {
                // publica: true -> el login no lleva token y un 401 aquí
                // significa "credenciales incorrectas", no "sesión vencida"
                const datos = await Sesion.llamarAPI(API_LOGIN, {
                    method: "POST",
                    body: { correo: correo, contrasena: contrasena },
                    publica: true
                });

                Sesion.guardarSesion(datos.token, datos.usuario);

                alert("Inicio de sesión correcto");

                if (datos.usuario.rol === "productor") {
                    window.location.href = "productor.html";
                } else {
                    window.location.href = "index.html";
                }

            } catch (error) {
                Sesion.mostrarError(error);
                boton.disabled = false;
            }
        });
    </script>

</body>

</html>
