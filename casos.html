<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Casos registrados - Cali Vigilante</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <h1>Cali Vigilante</h1>
        <p class="tagline">
            Registro ciudadano de presuntos abusos de autoridad
        </p>
        <nav class="main-nav">
            <ul>
                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="reportar.html">Reportar un caso</a>
                </li>

                <li>
                    <a href="casos.html">Ver casos registrados</a>
                </li>
            </ul>
        </nav>

    </header>

    <main>

        <section id="filtros">
            <h2>Buscar casos registrados</h2>
            <div class="campo">
                <label for="busqueda">
                    Buscar por lugar o palabra clave:
                </label>

                <input
                    type="search"
                    id="busqueda"
                    placeholder="Ej: Loma de la Cruz"
                >

            </div>


            <div class="campo">

                <label for="filtro-autoridad">
                    Filtrar por autoridad:
                </label>

                <select id="filtro-autoridad">

                    <option value="todas">Todas las autoridades</option>
                    <option value="policia">Policía Nacional</option>
                    <option value="esmad">ESMAD</option>
                    <option value="ejercito">Ejército</option>
                    <option value="otra">Otra</option>

                </select>

            </div>

        </section>


        <section id="lista-casos" aria-labelledby="titulo-casos">
            <h2 id="titulo-casos">
                Casos registradosc
            </h2>
            <p id="contador-casos">Casos registrados: 0 </p>
            <div id="contenedor-casos" class="casos-grid">
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Proyecto académico — Curso de Desarrollo Web.
           Datos de ejemplo, no representan casos reales.</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
