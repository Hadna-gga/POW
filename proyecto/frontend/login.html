<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Del Campo a Tu Mesa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#main">Saltar al contenido principal</a>
    <header>
        <h1>Del Campo a Tu Mesa</h1>
        <nav aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="registro.html">Registrarme</a>
        </nav>
    </header>

    <main id="main">
        <form class="formulario" id="formulario-login">
            <h2>Iniciar sesión</h2>
            <label for="correo">Correo</label>
            <input type="email" id="correo" autocomplete="username" required placeholder="Ingrese su correo">
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" autocomplete="current-password" required
                placeholder="Ingrese su contraseña">
            <button type="submit">Iniciar sesión</button>
        </form>
    </main>

    <footer>
        <p>Del Campo a Tu Mesa</p>
        <p>Comisión solidaria transparente</p>
    </footer>

    <script>
        const API_LOGIN = "/api/usuarios/login";

        document.getElementById("formulario-login").addEventListener("submit", async function (event) {
            event.preventDefault();

            const correo = document.getElementById("correo").value.trim();
            const contrasena = document.getElementById("contrasena").value;

            try {
                const respuesta = await fetch(API_LOGIN, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        correo: correo,
                        contrasena: contrasena
                    })
                });

                const datos = await respuesta.json();


                if (respuesta.ok) {
                    // Guardar el token y los datos del usuario
                    sessionStorage.setItem("token", datos.token);
                    sessionStorage.setItem("usuario", JSON.stringify(datos.usuario));

                    alert("Inicio de sesión correcto");

                    if (datos.usuario.rol === "productor") {
                        window.location.href = "productor.html";
                    } else if (datos.usuario.rol === "consumidor") {
                        window.location.href = "index.html";
                    }
                }
                else {
                    alert(datos.mensaje || "No se pudo iniciar sesión");
                }

            } catch (error) {
                console.error(error);
                alert("No se pudo conectar con el servidor");
            }
        });
    </script>

</body>

</html>
