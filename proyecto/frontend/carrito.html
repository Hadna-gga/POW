<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Del Campo a Tu Mesa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#main">Saltar al contenido principal</a>
    <header>
        <h1>Del Campo a Tu Mesa</h1>
        <nav aria-label="Navegación principal" id="menu-usuario">
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarme</a>
        </nav>
    </header>

    <main id="main" class="carrito-pagina">
        <a href="index.html" class="volver">
            ← Volver a la tienda
        </a>

        <h1>Mi carrito</h1>
        <div class="carrito-contenido">
            <section class="lista-carrito">
                <h2>Productos seleccionados</h2>
                <div id="productos-carrito"></div>
            </section>

            <section class="informacion-pago">
                <h2>Información de pago</h2>
                <fieldset class="metodos-pago">
                    <legend>Método de pago</legend>
                    <label>
                        <input type="radio" name="pago" value="credito">
                        Tarjeta de crédito
                    </label>
                    <label>
                        <input type="radio" name="pago" value="debito">
                        Tarjeta débito
                    </label>
                    <label>
                        <input type="radio" name="pago" value="otro">
                        Otro medio de pago
                    </label>
                </fieldset>
                <div class="resumen">
                    <p id="subtotal-carrito">Subtotal: $0</p>
                    <p>Envío: $0</p>
                    <p class="total" id="total-carrito">Total: $0</p>
                </div>
                <button type="button" class="comprar">
                    Realizar compra
                </button>
            </section>
        </div>
    </main>
    <script>

        const usuario = JSON.parse(sessionStorage.getItem("usuario") || "null");
        const token = sessionStorage.getItem("token");

        if (!usuario || usuario.rol !== "consumidor" || !token) {
            alert("Debes iniciar sesión como consumidor");
            window.location.href = "login.html";
        }

        const API_CARRITO = "/api/carrito/" + (usuario ? usuario.id : "");


        async function cargarCarrito() {
            const contenedor = document.getElementById("productos-carrito");

            try {
                const respuesta = await fetch(API_CARRITO, {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (!respuesta.ok) {
                    throw new Error("No se pudo consultar el carrito");
                }

                const carrito = await respuesta.json();

                contenedor.innerHTML = "";
                let subtotal = 0;

                if (carrito.productos.length === 0) {
                    contenedor.textContent = "Tu carrito está vacío.";
                }

                carrito.productos.forEach(item => {
                    const producto = item.producto;

                    if (!producto) return;

                    subtotal += producto.precio * item.cantidad;

                    const tarjeta = document.createElement("div");
                    tarjeta.className = "producto-carrito";

                    const imagen = document.createElement("div");
                    imagen.className = "producto-carrito-imagen";
                    imagen.textContent = "📦";

                    const informacion = document.createElement("div");
                    informacion.className = "producto-carrito-info";

                    const nombre = document.createElement("h3");
                    nombre.textContent = producto.nombre;

                    const precio = document.createElement("p");
                    precio.textContent = "$" +
                        producto.precio.toLocaleString("es-CO") + " / kg";

                    informacion.append(nombre, precio);

                    const cantidad = document.createElement("div");
                    cantidad.className = "cantidad";

                    const botonMenos = document.createElement("button");
                    botonMenos.type = "button";
                    botonMenos.textContent = "−";
                    botonMenos.setAttribute("aria-label", "Disminuir cantidad de " + producto.nombre);
                    botonMenos.disabled = item.cantidad <= 1;

                    const numero = document.createElement("span");
                    numero.textContent = item.cantidad;

                    const botonMas = document.createElement("button");
                    botonMas.type = "button";
                    botonMas.textContent = "+";
                    botonMas.setAttribute("aria-label", "Aumentar cantidad de " + producto.nombre);
                    botonMas.disabled = item.cantidad >= producto.cantidad;

                    cantidad.append(botonMenos, numero, botonMas);
                    // ACTUALIZAR CANTIDAD EN MONGODB
                    async function cambiarCantidad(nuevaCantidad) {
                        try {
                            const respuesta = await fetch(
                                API_CARRITO + "/productos/" + producto._id,
                                {
                                    method: "PATCH",
                                    headers: {
                                        "Content-Type": "application/json",
                                        "Authorization": "Bearer " + token
                                    },
                                    body: JSON.stringify({
                                        cantidad: nuevaCantidad
                                    })
                                }
                            );

                            if (!respuesta.ok) {
                                const error = await respuesta.json();
                                throw new Error(error.mensaje || "Error al actualizar");
                            }

                            await cargarCarrito();

                        } catch (error) {
                            console.error(error);
                            alert(error.message);
                        }
                    }

                    // BOTÓN PARA AUMENTAR
                    botonMas.addEventListener("click", function () {
                        cambiarCantidad(item.cantidad + 1);
                    });

                    // BOTÓN PARA DISMINUIR
                    botonMenos.addEventListener("click", function () {
                        cambiarCantidad(item.cantidad - 1);
                    });

                    const botonEliminar = document.createElement("button");
                    botonEliminar.type = "button";
                    botonEliminar.className = "eliminar";
                    botonEliminar.textContent = "Eliminar";

                    botonEliminar.addEventListener("click", async function () {
                        if (!confirm("¿Deseas eliminar este producto del carrito?")) {
                            return;
                        }

                        try {

                            const respuestaEliminar = await fetch(
                                API_CARRITO + "/productos/" + producto._id,
                                {
                                    method: "DELETE",
                                    headers: {
                                        "Authorization": "Bearer " + token
                                    }
                                }
                            );


                            if (!respuestaEliminar.ok) {
                                throw new Error("No se pudo eliminar el producto");
                            }

                            alert("Producto eliminado del carrito");
                            await cargarCarrito();

                        } catch (error) {
                            console.error(error);
                            alert("Error al eliminar el producto");
                        }
                    });

                    tarjeta.append(
                        imagen,
                        informacion,
                        cantidad,
                        botonEliminar
                    );

                    contenedor.appendChild(tarjeta);
                });

                document.getElementById("subtotal-carrito").textContent =
                    "Subtotal: $" + subtotal.toLocaleString("es-CO");

                document.getElementById("total-carrito").textContent =
                    "Total: $" + subtotal.toLocaleString("es-CO");

            } catch (error) {
                console.error(error);
                contenedor.textContent = "No se pudo cargar el carrito.";
            }
        }

        cargarCarrito();
    </script>

    <script>
        function actualizarMenuUsuario() {
            const menu = document.getElementById("menu-usuario");
            const usuarioActual = JSON.parse(
                sessionStorage.getItem("usuario") || "null"
            );

            if (!usuarioActual || !sessionStorage.getItem("token")) {
                return;
            }

            menu.innerHTML = "";

            const saludo = document.createElement("span");
            saludo.textContent = "Hola, " + usuarioActual.nombre;

            const botonCerrar = document.createElement("button");
            botonCerrar.type = "button";
            botonCerrar.textContent = "Cerrar sesión";

            botonCerrar.addEventListener("click", function () {
                sessionStorage.removeItem("token");
                sessionStorage.removeItem("usuario");

                window.location.href = "login.html";
            });

            menu.append(saludo, botonCerrar);
        }

        actualizarMenuUsuario();
    </script>

</body>

</html>
