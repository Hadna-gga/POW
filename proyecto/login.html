<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Del Campo a Tu Mesa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Del Campo a Tu Mesa</h1>
        <nav>
            <button><a href="index.html">Inicio</a></button>
            <button><a href="registro.html">Registrarme</a></button>
        </nav>
    </header>

    <main>
        <section class="formulario">
            <h2>Iniciar sesión</h2>
            <label for="correo">Correo</label>
            <input
                type="email"
                id="correo"
                placeholder="Ingrese su correo"
            >
            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                placeholder="Ingrese su contraseña"
            >
            <button><a href="logout.html">Iniciar sesión</a></button>
        </section>
    </main>

    <footer>
        <p>Del Campo a Tu Mesa</p>
        <p>Comisión solidaria transparente</p>
    </footer>

</body>
</html>
