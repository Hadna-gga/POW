<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Del Campo a Tu Mesa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#main">Saltar al contenido principal</a>
    <header>
        <h1>Del Campo a Tu Mesa</h1>
        <nav aria-label="Navegación principal">
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarme</a>
        </nav>
    </header>

    <main id="main" class="carrito-pagina">
        <a href="index.html" class="volver">
            ← Volver a la tienda
        </a>

        <h1>Mi carrito</h1>
        <div class="carrito-contenido">
            <section class="lista-carrito">
                <h2>Productos seleccionados</h2>
                <div class="producto-carrito">
                    <label class="seleccionar">
                        <input type="checkbox" aria-label="Seleccionar zanahoria">
                    </label>
                    <div class="producto-carrito-imagen" aria-hidden="true">
                        🥕
                    </div>
                    <div class="producto-carrito-info">
                        <h3>Zanahoria</h3>
                        <p>$3.000 / kg</p>
                    </div>
                    <div class="cantidad">
                        <button type="button" aria-label="Reducir cantidad de zanahoria">-</button>
                        <span>1</span>
                        <button type="button" aria-label="Aumentar cantidad de zanahoria">+</button>
                    </div>
                    <button type="button" class="eliminar" aria-label="Eliminar zanahoria del carrito">
                        Eliminar
                    </button>
                </div>

                <div class="producto-carrito">

                    <label class="seleccionar">
                        <input type="checkbox" aria-label="Seleccionar lechuga">
                    </label>
                    <div class="producto-carrito-imagen" aria-hidden="true">
                        🥬
                    </div>
                    <div class="producto-carrito-info">
                        <h3>Lechuga</h3>
                        <p>$4.000</p>
                    </div>
                    <div class="cantidad">
                        <button type="button" aria-label="Reducir cantidad de lechuga">-</button>
                        <span>1</span>
                        <button type="button" aria-label="Aumentar cantidad de lechuga">+</button>
                    </div>
                    <button type="button" class="eliminar" aria-label="Eliminar lechuga del carrito">
                        Eliminar
                    </button>
                </div>
            </section>

            <section class="informacion-pago">
                <h2>Información de pago</h2>
                <fieldset class="metodos-pago">
                    <legend>Método de pago</legend>
                    <label>
                        <input type="radio" name="pago" value="credito">
                        Tarjeta de crédito
                    </label>
                    <label>
                        <input type="radio" name="pago" value="debito">
                        Tarjeta débito
                    </label>
                    <label>
                        <input type="radio" name="pago" value="otro">
                        Otro medio de pago
                    </label>
                </fieldset>
                <div class="resumen">
                    <p>Subtotal: $7.000</p>
                    <p>Envío: $0</p>
                    <p class="total">
                        Total: $7.000
                    </p>
                </div>

                <button type="button" class="comprar">
                    Realizar compra
                </button>
            </section>
        </div>
    </main>
</body>
</html>
