<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar producto | Del Campo a Tu Mesa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#main">Saltar al contenido principal</a>
    <div class="pagina-productor">
        <aside class="barra-lateral">
            <h2>Productor</h2>
            <nav aria-label="Navegación del productor">
                <a href="perfil-productor.html">
                    <span aria-hidden="False">👤</span><span class="nav-label">Perfil</span>
                </a>
                <a href="productos-productor.html">
                    <span aria-hidden="true">📦</span><span class="nav-label">Productos</span>
                </a>
                <a href="inventario-productor.html">
                    <span aria-hidden="true">🗃️</span><span class="nav-label">Inventario</span>
                </a>
                <a href="productor.html">
                    <span aria-hidden="true">↩️</span><span class="nav-label">Inicio</span>
                </a>
                <a href="index.html">
                    <span aria-hidden="true">🏠</span><span class="nav-label">Página principal</span>
                </a>
                <button type="button" id="cerrar-sesion">
                    <span aria-hidden="true">🚪</span>
                    <span class="nav-label">Cerrar sesión</span>
                </button>
            </nav>
        </aside>

        <main id="main" class="editar-producto">
            <form class="edicion-producto" id="form-agregar-producto">
                <h1>Agregar producto</h1>
                <div class="editar-imagen-producto" aria-hidden="true">Imagen del producto</div>
                <label for="imagen-producto">Seleccionar imagen del producto</label>
                <input id="imagen-producto" type="file" accept="image/*">
                <div class="edicion">
                    <label for="nombre-producto">Nombre:</label>
                    <input id="nombre-producto" type="text" placeholder="Ej. Zanahoria" required>
                </div>
                <div class="edicion">
                    <label for="descripcion-producto">Descripción:</label>
                    <textarea id="descripcion-producto" rows="3" required></textarea>
                </div>
                <div class="edicion">
                    <label for="precio-producto">Precio por kg:</label>
                    <input id="precio-producto" type="number" min="0" step="0.01" required>
                </div>
                <div class="edicion">
                    <label for="cantidad-producto">Cantidad disponible:</label>
                    <input id="cantidad-producto" type="number" min="0" step="1" required>
                </div>
                <button type="submit">Guardar producto</button>
                <a class="button-link" href="productos-productor.html">Cancelar</a>
            </form>
        </main>
    </div>
    <script>
        const formulario = document.getElementById("form-agregar-producto");

        formulario.addEventListener("submit", async function (evento) {
            evento.preventDefault();
            const token = sessionStorage.getItem("token");

            if (!token) {
                alert("Debes iniciar sesión como productor");
                window.location.href = "login.html";
                return;
            }

            const producto = {
                nombre: document.getElementById("nombre-producto").value,
                descripcion: document.getElementById("descripcion-producto").value,
                precio: Number(document.getElementById("precio-producto").value),
                cantidad: Number(document.getElementById("cantidad-producto").value),
                imagen: ""
            };

            try {
                const respuesta = await fetch("https://literate-space-train-wvgwjp7j766gcv4qr-3000.app.github.dev/api/productos", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify(producto)
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    alert("Producto guardado correctamente");
                    window.location.href = "productos-productor.html";
                } else {
                    alert(datos.mensaje || "Error al guardar el producto");
                }

            } catch (error) {
                console.error(error);
                alert("No se pudo conectar con el servidor");
            }
        });
    </script>
    <script>
        document.getElementById("cerrar-sesion").addEventListener("click", function () {
            sessionStorage.removeItem("token");
            sessionStorage.removeItem("usuario");

            window.location.replace("login.html");
        });
    </script>
</body>

</html>
