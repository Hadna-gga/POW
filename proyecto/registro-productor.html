<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Del Campo a Tu Mesa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Del Campo a Tu Mesa</h1>
        <nav>
            <button><a href="index.html">Inicio</a></button>
            <button><a href="login.html">Iniciar sesión</a></button>
        </nav>
    </header>

    <main>
        <section class="formulario">
            <h2>Crear una cuenta</h2>

            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                placeholder="Ingrese su nombre"
            >
            <label for="correo">Correo</label>
            <input
                type="email"
                id="correo"
                placeholder="Ingrese su correo"
            >
            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                placeholder="Establezca una contraseña"
            >
            <div class="accept">
                <label>
                    <input type="checkbox" name="accept" value="condition">
                    <h6>Esta pagina trabaja con un porcentaje minimo de comision 
                    calculada de acuerdo con el valor total de la venta (5%).<br>
                    Al seleccionar esto acepto la comisión correspondiente a 
                    mi  compra.</h6>
                </label>
            </div>
            <button><a href = "productor.html">Registrarme</a></button>
        </section>

    </main>
    <footer>
        <p>Del Campo a Tu Mesa</p>
        <p>Comisión solidaria transparente</p>
    </footer>

</body>
</html>
