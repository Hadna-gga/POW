<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del productor | Del Campo a Tu Mesa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main">Saltar al contenido principal</a>
    
     
    <div class="pagina-productor">
        <aside class="barra-lateral">
            <h2>Productor</h2>
            <nav aria-label="Navegación del productor">
                <a href="perfil-productor.html">
                    <span aria-hidden="true">👤</span><span class="nav-label">Perfil</span>
                </a>
                <a href="productos-productor.html">
                    <span aria-hidden="true">📦</span><span class="nav-label">Productos</span>
                </a>
                <a href="inventario-productor.html">
                    <span aria-hidden="true">🗃️</span><span class="nav-label">Inventario</span>
                </a>
                <a href="productor.html">
                    <span aria-hidden="true">↩️</span><span class="nav-label">Inicio</span>
                </a>
                <a href="index.html">
                    <span aria-hidden="true">🏠</span><span class="nav-label">Página principal</span>
                </a>
            </nav>
        </aside>

        <main id="main" class="contenido-perfil">

            <h1>Mi perfil</h1>
            <span aria-hidden="true">👤</span>
            <div class="dato">
                <label for="ciudad">Ciudad:</label>
                <input id="ciudad" type="text" value="Cali" readonly>
            </div>

            <div class="dato">
                <label for="nombre">Nombre:</label>
                <input id="nombre" type="text" value="Pepito" readonly>
            </div>

            <div class="dato">
                <label for="correo">Correo:</label>
                <input id="correo" type="email" value="productor@gmail.com" readonly>
            </div>

            <div class="dato">
                <label for="telefono">Teléfono:</label>
                <input id="telefono" type="tel" value="3001234567" readonly>
            </div>

            <button type="button">Editar perfil</button>
        </main>
    </div>
</body>
</html>
